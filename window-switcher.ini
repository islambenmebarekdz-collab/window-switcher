# Whether to show trayicon, yes/no
trayicon = yes

[switch-windows]

# Hotkey to switch windows (multiple hotkeys can be separated by ||)
hotkey = alt+`

# List of hotkey conflict apps
# e.g. game1.exe,game2.exe
blacklist =

# Ignore minimal windows
ignore_minimal = no

# Switch to windows from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[switch-apps]

# Whether to enable switching apps
enable = no

# Hotkey to switch apps (multiple hotkeys can be separated by ||)
hotkey = alt+tab

# Ignore minimal windows
ignore_minimal = no

# Speak the selected app to the screen reader while cycling, including its
# position in the list ("Firefox, 3 of 7"). Uses the UI Automation notification
# event, which NVDA, Narrator and JAWS listen for.
# Off by default: each app is really activated as you cycle, so the screen
# reader already announces it, and this adds a second utterance.
announce = no

# Present the switcher as a real accessible list, the way the built-in Alt-Tab
# does: the overlay itself takes focus and exposes a UI Automation list whose
# items are named after your windows, so a screen reader reads the selection as
# you move through it and object navigation can explore it.
# While cycling nothing is activated, restored or reordered - apps are only
# touched once you commit - so it is also faster and leaves minimized windows
# alone. Requires a screen reader to be useful; leave it off otherwise.
accessible_list = no

# List of override icons, syntax: app1.exe=icon1.ico,app2.exe=icon2.png.
# The icon path can be a full path or a relative path to the app's directory.
# The icon format can be ico or png.
override_icons =

# Switch to apps from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[log]

# Log level can be one of off,error,warn,info,debug,trace.
level = info

# Log file path.
# e.g.
#   window-switcher.log (located in the same directory as window-switcher.exe)
#   C:\Users\sigod\AppData\Local\Temp\window-switcher.log (or used the full path)
path =
