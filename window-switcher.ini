# Whether to show trayicon, yes/no
trayicon = yes

[switch-windows]

# Hotkey to switch windows (multiple hotkeys can be separated by ||)
hotkey = alt+`

# List of hotkey conflict apps
# e.g. game1.exe,game2.exe
blacklist =

# Ignore minimal windows
ignore_minimal = no

# Switch to windows from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[switch-apps]

# Whether to enable switching apps
enable = no

# Hotkey to switch apps (multiple hotkeys can be separated by ||)
hotkey = alt+tab

# Ignore minimal windows
ignore_minimal = no

# Speak the selected app and its position ("Firefox, 3 of 7") to the screen
# reader while cycling, through the UI Automation notification event that NVDA,
# Narrator and JAWS listen for. On by default, since in the default mode below
# nothing is activated as you cycle and so nothing else says it out loud.
announce = yes

# Switch the way macOS does: while you hold the hotkey nothing at all happens to
# your windows. The overlay holds focus and exposes the choices as a real UI
# Automation list, so a screen reader reads the selection and object navigation
# can explore it; only when you release the hotkey is the app you settled on
# activated. Nothing is activated, restored or reordered on the way past.
#
# Setting this to no restores the old behaviour of activating each app as you
# pass it. That is what made switching unreliable: Windows refuses foreground
# changes from a process that does not own the foreground while still reporting
# success, so the selection moved but the screen did not; and changing focus
# with Alt held makes the app you land on open its menu bar, which reads out as
# grid coordinates and swallows the following keystrokes.
accessible_list = yes

# List of override icons, syntax: app1.exe=icon1.ico,app2.exe=icon2.png.
# The icon path can be a full path or a relative path to the app's directory.
# The icon format can be ico or png.
override_icons =

# Switch to apps from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[log]

# Log level can be one of off,error,warn,info,debug,trace.
level = info

# Log file path.
# e.g.
#   window-switcher.log (located in the same directory as window-switcher.exe)
#   C:\Users\sigod\AppData\Local\Temp\window-switcher.log (or used the full path)
path =
